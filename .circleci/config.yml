restore_registry: &RESTORE_REGISTRY
  restore_cache:
    key: registry
save_registry: &SAVE_REGISTRY
  save_cache:
    key: registry-2-{{ .BuildNum }}
    paths:
      - /home/circleci/.cargo/registry/index
deps_key: &DEPS_KEY
  key: deps-2-{{ checksum "~/rust-version" }}-{{ checksum "Cargo.lock" }}
restore_deps: &RESTORE_DEPS
  restore_cache:
    <<: *DEPS_KEY
save_deps: &SAVE_DEPS
  save_cache:
    <<: *DEPS_KEY
    paths:
      - target
      - /home/circleci/.cargo/registry/cache

version: 2
jobs:
  circle-all:
    docker:
      - image: cimg/rust:1.86.0-node
    environment:
      CARGO_BUILD_RUSTFLAGS: -D warnings
    steps:
      - checkout
      - run: rustup target add wasm32-unknown-unknown
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - *RESTORE_REGISTRY
      - run: cargo generate-lockfile
      - *SAVE_REGISTRY
      - run: rustc --version > ~/rust-version
      - *RESTORE_DEPS
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all --all-targets
      - run: cargo test --all
      - run: cd conjure-runtime-wasm-test && wasm-pack test --node
      - *SAVE_DEPS

workflows:
  version: 2
  main:
    jobs:
      - circle-all:
          filters: { tags: { only: /.*/ } }
