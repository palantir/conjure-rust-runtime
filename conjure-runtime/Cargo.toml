[package]
name = "conjure-runtime"
version.workspace = true
authors = ["Steven Fackler <sfackler@palantir.com>"]
edition = "2018"
license = "Apache-2.0"
description = "An HTTP client compatible with Conjure-generated services"
repository = "https://github.com/palantir/conjure-rust-runtime"
readme = "../README.md"

[features]
js = ["dep:getrandom", "getrandom/wasm_js", "conjure-object/js"]

[dependencies]
arc-swap = "1.0"
bytes = "1.0"
conjure-error = "5.0.0"
conjure-http = "5.1.0"
conjure-object = "5.0.0"
conjure-runtime-config = { version = "7.2.0", path = "../conjure-runtime-config" }
conjure-serde = "5.0.0"
futures = "0.3"
http-body = "1"
http-body-util = "0.1"
http-zipkin = "1.0"
http = "1"
linked-hash-map = "0.5"
once_cell = "1.0"
parking_lot = "0.12"
percent-encoding = "2.1"
pin-project = "1.0"
rand = "0.10"
refreshable = "2.0"
regex = "1.0"
serde-value = "0.7"
serde = "1.0"
tokio-util = { version = "0.7", features = ["codec"] }
tokio = { version = "1.0", features = ["io-util", "sync"] }
url = "2.0"
witchcraft-log = "5.0.0-rc1"
witchcraft-metrics = "1"
zipkin = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
flate2 = "1.0"
hyper = { version = "1", features = ["http1", "http2", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "http2",
    "tls12",
    "logging",
] }
hyper-util = { version = "0.1", features = [
    "http1",
    "http2",
    "client",
    "client-legacy",
    "tokio",
] }
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
tokio-io-timeout = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "time"] }
tower-layer = "0.3"
tower-service = "0.3"
webpki-roots = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", optional = true }
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = [
    "AbortController",
    "AbortSignal",
    "Headers",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultController",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "UnderlyingSource",
] }

[dev-dependencies]
conjure-codegen = { version = "5.0.0", features = ["example-types"] }
futures-test = "0.3"
hyper = { version = "1", features = ["server"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
] }
openssl = "0.10.50"
serde_yaml = "0.9"
tokio-openssl = "0.6"
tokio-test = "0.4"
tokio = { version = "1.0", features = ["full"] }
tower-util = "0.3"
